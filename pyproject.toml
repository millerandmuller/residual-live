[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-live"
version = "0.1.0"
description = "Real-time royalty clearing and settlement engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "websockets>=12.0",
    "google-adk>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
